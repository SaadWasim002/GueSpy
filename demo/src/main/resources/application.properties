# Load local secrets from a gitignored .env file (see .env.example).
# "optional:" means the app still starts if the file is absent, as long as
# the variables below are provided some other way (real environment vars).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guespy}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
# Prints SQL queries in the console

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Tells Hibernate which SQL flavor to use

app.jwtSecret=${JWT_SECRET}
